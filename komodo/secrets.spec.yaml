# Manifesto de segredos (scripts/init). Uma chave por linha:
#   generate: N [, charset: hex]  → gerado se faltar (padrão alfanumérico)
#   ask: true                     → perguntado se faltar
#   from: instance.X              → valor compartilhado da seção instance
KOMODO_DATABASE_USERNAME: { generate: 16 }
KOMODO_DATABASE_PASSWORD: { generate: 32 }
KOMODO_INIT_ADMIN_USERNAME: { from: instance.admin_user }
KOMODO_INIT_ADMIN_PASSWORD: { ask: true }
KOMODO_WEBHOOK_SECRET: { generate: 48 }
KOMODO_JWT_SECRET: { generate: 64 }
