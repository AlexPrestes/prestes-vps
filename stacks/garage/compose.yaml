services:
  garage:
    image: dxflrs/garage:v2.4.1@sha256:9c96caa2612d3411acc5b0e6701fb238dbfba33e533a6d7d3d811a4b12d0d020
    restart: unless-stopped
    command: ["/garage", "-c", "/etc/garage/garage.toml", "server"]
    secrets:
      - GARAGE_RPC_SECRET
      - GARAGE_ADMIN_TOKEN
      - GARAGE_METRICS_TOKEN
    volumes:
      - ./config:/etc/garage:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    mem_limit: 512m
    networks: [s3]

volumes:
  garage-meta:
  garage-data:

networks:
  s3:
    internal: true

secrets:
  GARAGE_RPC_SECRET:
    file: ./.secrets/GARAGE_RPC_SECRET
  GARAGE_ADMIN_TOKEN:
    file: ./.secrets/GARAGE_ADMIN_TOKEN
  GARAGE_METRICS_TOKEN:
    file: ./.secrets/GARAGE_METRICS_TOKEN
