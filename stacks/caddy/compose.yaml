services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    command: caddy run --config /etc/caddy/Caddyfile --adapter caddyfile --watch
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./config:/etc/caddy:ro
      - ./site:/srv/site:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [default, edge-komodo]

volumes:
  caddy-data:
  caddy-config:

networks:
  default:
  edge-komodo:
    external: true
