name: segredos

on: [push, pull_request]

permissions:
  contents: read

jobs:
  cifrados:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Todo *.enc.* está cifrado com sops
        run: git ls-files -z | grep -zE '\.enc\.(env|ya?ml|json)$' | xargs -0 scripts/check-encrypted.sh
