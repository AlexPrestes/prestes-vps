services:
  mongo:
    image: mongo:8.3.11@sha256:5d7043a4ffe02b9ed1b6e0bab057546981af5ca0a79107e9c461e49bc44c0a7b
    labels:
      komodo.skip:
    command: --quiet --wiredTigerCacheSizeGB 0.25
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
    environment:
      MONGO_INITDB_ROOT_USERNAME_FILE: /run/secrets/KOMODO_DATABASE_USERNAME
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/KOMODO_DATABASE_PASSWORD
    secrets: [KOMODO_DATABASE_USERNAME, KOMODO_DATABASE_PASSWORD]
    networks: [db]

  core:
    image: ghcr.io/moghtech/komodo-core:2.3.3@sha256:bca73d0eee143066228fb9b80c38a5a2726e573ad2758f7aa92b5c91a8aef1c7
    labels:
      komodo.skip:
    init: true
    restart: unless-stopped
    depends_on: [mongo]
    ports:
      - 127.0.0.1:9120:9120
    env_file: [compose.env]
    environment:
      KOMODO_DATABASE_ADDRESS: mongo:27017
      KOMODO_DATABASE_USERNAME_FILE: /run/secrets/KOMODO_DATABASE_USERNAME
      KOMODO_DATABASE_PASSWORD_FILE: /run/secrets/KOMODO_DATABASE_PASSWORD
      KOMODO_INIT_ADMIN_PASSWORD_FILE: /run/secrets/KOMODO_INIT_ADMIN_PASSWORD
      KOMODO_WEBHOOK_SECRET_FILE: /run/secrets/KOMODO_WEBHOOK_SECRET
      KOMODO_JWT_SECRET_FILE: /run/secrets/KOMODO_JWT_SECRET
    secrets:
      - KOMODO_DATABASE_USERNAME
      - KOMODO_DATABASE_PASSWORD
      - KOMODO_INIT_ADMIN_PASSWORD
      - KOMODO_WEBHOOK_SECRET
      - KOMODO_JWT_SECRET
    volumes:
      - keys:/config/keys
      - /etc/komodo/backups:/backups
    networks:
      default:
      db:
      edge:
        aliases: [komodo-core]

  periphery:
    image: ghcr.io/moghtech/komodo-periphery:2.3.3@sha256:fa3f1a641a265216066676950d5eecdf506955a7bafe2f01996135ae93115cd5
    labels:
      komodo.skip:
    init: true
    restart: unless-stopped
    depends_on: [core]
    env_file: [compose.env]
    environment:
      SOPS_AGE_KEY_FILE: /run/secrets/age_key
    secrets:
      - age_key
    volumes:
      - keys:/config/keys
      - /var/run/docker.sock:/var/run/docker.sock
      - /proc:/proc
      - /etc/komodo:/etc/komodo
      - /usr/local/bin/sops:/usr/local/bin/sops:ro
    networks: [default]

volumes:
  mongo-data:
  mongo-config:
  keys:

networks:
  default:
  db:
    internal: true
  edge:
    name: edge-komodo

secrets:
  age_key:
    file: /etc/sops/age/keys.txt
  KOMODO_DATABASE_USERNAME:
    file: .secrets/KOMODO_DATABASE_USERNAME
  KOMODO_DATABASE_PASSWORD:
    file: .secrets/KOMODO_DATABASE_PASSWORD
  KOMODO_INIT_ADMIN_PASSWORD:
    file: .secrets/KOMODO_INIT_ADMIN_PASSWORD
  KOMODO_WEBHOOK_SECRET:
    file: .secrets/KOMODO_WEBHOOK_SECRET
  KOMODO_JWT_SECRET:
    file: .secrets/KOMODO_JWT_SECRET
