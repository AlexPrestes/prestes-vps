- ansible.builtin.import_playbook: check.yml

- name: Komodo
  hosts: prestes-vps
  become: true
  vars:
    komodo_src: "{{ playbook_dir }}/../komodo"
    komodo_dir: /opt/komodo
    komodo_spec: "{{ lookup('file', komodo_src + '/secrets.spec.yaml') | from_yaml }}"
    # O Mongo lê os seus já como o usuário mongodb (uid 999).
    mongo_secrets: [KOMODO_DATABASE_USERNAME, KOMODO_DATABASE_PASSWORD]

  tasks:
    - name: Verifica suporte a AVX (exigido pelo MongoDB 5+)
      ansible.builtin.command: grep -q avx /proc/cpuinfo
      changed_when: false

    - name: Diretórios
      ansible.builtin.file: { path: "{{ item.path }}", state: directory, mode: "{{ item.mode }}" }
      loop:
        - { path: "{{ komodo_dir }}", mode: "0750" }
        - { path: /etc/komodo, mode: "0755" }
        - { path: /etc/komodo/backups, mode: "0750" }

    - name: Arquivos do compose
      ansible.builtin.copy:
        src: "{{ komodo_src }}/{{ item }}"
        dest: "{{ komodo_dir }}/{{ item }}"
        mode: "0640"
      loop: [compose.yaml, compose.env]

    - name: Diretório de segredos
      ansible.builtin.file: { path: "{{ komodo_dir }}/.secrets", state: directory, mode: "0700" }

    # Um arquivo por chave do manifesto, montado em /run/secrets pelo Compose.
    - name: Segredos
      ansible.builtin.copy:
        content: "{{ secrets.instance[item.value['from'].split('.')[1]] if 'from' in item.value else secrets.komodo[item.key] }}"
        dest: "{{ komodo_dir }}/.secrets/{{ item.key }}"
        owner: "{{ '999' if item.key in mongo_secrets else 'root' }}"
        mode: "0400"
      loop: "{{ komodo_spec | dict2items }}"
      loop_control: { label: "{{ item.key }}" }
      no_log: true

    - name: Segredos existentes
      ansible.builtin.find: { paths: "{{ komodo_dir }}/.secrets" }
      register: komodo_secret_files

    - name: Remove segredos fora do manifesto
      ansible.builtin.file: { path: "{{ item.path }}", state: absent }
      loop: "{{ komodo_secret_files.files | rejectattr('path', 'search', '/(' ~ (komodo_spec.keys() | join('|')) ~ ')$') }}"
      loop_control: { label: "{{ item.path | basename }}" }

    - name: Sobe o Komodo
      community.docker.docker_compose_v2:
        project_src: "{{ komodo_dir }}"
        project_name: komodo
        state: present
